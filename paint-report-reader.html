<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paint Report Reader</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      min-height: 100vh;
      padding: 20px;
      color: #fff;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #ff6b35 0%, #ff8c42 100%);
      padding: 30px;
      text-align: center;
    }

    .header h1 {
      font-size: 32px;
      margin-bottom: 8px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
    }

    .header p {
      font-size: 14px;
      opacity: 0.95;
      font-weight: 500;
    }

    .badge {
      display: inline-block;
      background: rgba(255, 255, 255, 0.25);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      margin-top: 10px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .content {
      padding: 40px;
      color: #333;
    }

    .upload-zone {
      border: 3px dashed #ccc;
      border-radius: 8px;
      padding: 50px 30px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      background: #f9f9f9;
      margin-bottom: 30px;
    }

    .upload-zone:hover {
      border-color: #ff6b35;
      background: #fff5f2;
    }

    .upload-zone.dragover {
      border-color: #ff6b35;
      background: #fff5f2;
      transform: scale(1.02);
    }

    .upload-icon {
      font-size: 64px;
      margin-bottom: 15px;
    }

    .upload-text {
      font-size: 18px;
      color: #555;
      margin-bottom: 8px;
    }

    .upload-hint {
      font-size: 14px;
      color: #888;
    }

    .file-input {
      display: none;
    }

    .btn {
      background: linear-gradient(135deg, #ff6b35 0%, #ff8c42 100%);
      color: white;
      border: none;
      padding: 15px 40px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      box-shadow: 0 4px 12px rgba(255, 107, 53, 0.3);
      transition: all 0.3s ease;
      width: 100%;
      margin-top: 20px;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(255, 107, 53, 0.4);
    }

    .btn:disabled {
      background: #ccc;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    .file-info {
      background: #e8f4f8;
      padding: 15px;
      border-radius: 6px;
      margin: 20px 0;
      border-left: 4px solid #3498db;
    }

    .file-name {
      font-weight: 600;
      color: #2c3e50;
      margin-bottom: 5px;
    }

    .file-size {
      font-size: 14px;
      color: #7f8c8d;
    }

    .status {
      padding: 15px;
      border-radius: 6px;
      margin: 15px 0;
      font-weight: 500;
    }

    .status.success {
      background: #d4edda;
      color: #155724;
      border-left: 4px solid #28a745;
    }

    .status.error {
      background: #f8d7da;
      color: #721c24;
      border-left: 4px solid #dc3545;
    }

    .status.warning {
      background: #fff3cd;
      color: #856404;
      border-left: 4px solid #ffc107;
    }

    .results {
      margin-top: 30px;
    }

    .result-header {
      background: #2c3e50;
      color: white;
      padding: 15px 20px;
      border-radius: 6px 6px 0 0;
      font-weight: 600;
      font-size: 18px;
    }

    .result-table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .result-table th {
      background: #34495e;
      color: white;
      padding: 12px;
      text-align: left;
      font-weight: 600;
      font-size: 14px;
    }

    .result-table td {
      padding: 12px;
      border-bottom: 1px solid #ecf0f1;
      font-size: 14px;
    }

    .result-table tr:last-child td {
      border-bottom: none;
    }

    .result-table tr:hover {
      background: #f8f9fa;
    }

    .totals-row {
      background: #e8f4f8 !important;
      font-weight: 700;
      color: #2c3e50;
    }

    .totals-row td {
      border-top: 2px solid #3498db;
    }

    .raw-text-section {
      margin-top: 20px;
      padding: 15px;
      background: #f5f5f5;
      border-radius: 6px;
      max-height: 300px;
      overflow-y: auto;
    }

    .raw-text-section h3 {
      color: #2c3e50;
      margin-bottom: 10px;
      font-size: 16px;
    }

    .raw-text-section pre {
      background: white;
      padding: 15px;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      color: #333;
      white-space: pre-wrap;
      word-wrap: break-word;
      border: 1px solid #ddd;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🎨 PAINT REPORT READER</h1>
      <p>VINYL EXTRUSION TRACKER</p>
      <div class="badge">100% LOCAL - NO DATA LEAVES YOUR COMPUTER - NO INTERNET REQUIRED AFTER LOAD</div>
      <div style="font-size: 11px; margin-top: 12px; opacity: 0.85;">Version: 2.3 | Last Updated: 2026-07-14 | By: Alok</div>
    </div>

    <div class="content">
      <div class="upload-zone" id="uploadZone">
        <div class="upload-icon">📄</div>
        <div class="upload-text">DROP PAINT REPORT HERE</div>
        <div class="upload-hint">PDF (text or scanned) · JPG · PNG · Any photo of the report</div>
      </div>

      <input type="file" id="fileInput" class="file-input" accept=".pdf,.jpg,.jpeg,.png" multiple>

      <div id="fileInfo" style="display: none;"></div>
      <div id="status"></div>

      <button id="readBtn" class="btn" style="display: none;">READ REPORT</button>
      <button id="exportBtn" class="btn" style="display: none;">EXPORT TO EXCEL</button>

      <div id="results" class="results" style="display: none;"></div>
      <div id="rawTextSection" class="raw-text-section" style="display: none;"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
  <!-- xlsx-js-style: SheetJS fork that supports cell styling (borders, fills, fonts).
       The plain community xlsx build silently ignores all style properties. -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    // PLACEHOLDER — to be replaced with per-surface paint rate constants.
    const FT_PER_GALLON = 400;

    let currentFile = null;
    let extractedData = null;
    let rawExtractedText = '';

    const uploadZone = document.getElementById('uploadZone');
    const fileInput = document.getElementById('fileInput');
    const readBtn = document.getElementById('readBtn');
    const exportBtn = document.getElementById('exportBtn');
    const fileInfo = document.getElementById('fileInfo');
    const statusDiv = document.getElementById('status');
    const resultsDiv = document.getElementById('results');
    const rawTextSection = document.getElementById('rawTextSection');

    // Upload zone interactions
    uploadZone.addEventListener('click', () => fileInput.click());
    
    uploadZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadZone.classList.add('dragover');
    });
    
    uploadZone.addEventListener('dragleave', () => {
      uploadZone.classList.remove('dragover');
    });
    
    uploadZone.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadZone.classList.remove('dragover');
      if (e.dataTransfer.files.length > 0) {
        handleFiles(Array.from(e.dataTransfer.files));
      }
    });

    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        handleFiles(Array.from(e.target.files));
      }
    });

    let fileQueue = [];
    let currentFileIndex = 0;
    let allParsedData = [];

    function handleFiles(files) {
      fileQueue = files;
      currentFileIndex = 0;
      allParsedData = [];
      processQueue();
    }

    async function processQueue() {
      if (currentFileIndex >= fileQueue.length) {
        // All files processed, consolidate and export
        if (allParsedData.length > 0) {
          consolidateAndExport();
        } else {
          statusDiv.innerHTML = '<div class="status error">❌ No valid reports to export.</div>';
        }
        return;
      }

      const file = fileQueue[currentFileIndex];
      const fileNum = fileQueue.length > 1 ? ` (${currentFileIndex + 1}/${fileQueue.length})` : '';
      fileInfo.innerHTML = `
        <div class="file-name">✓ ${file.name}${fileNum}</div>
        <div class="file-size">${(file.size / 1024).toFixed(2)} KB</div>
      `;
      fileInfo.style.display = 'block';

      // For single file: show read button. For multiple: auto-process
      if (fileQueue.length === 1) {
        currentFile = file;
        readBtn.style.display = 'block';
        exportBtn.style.display = 'none';
        resultsDiv.style.display = 'none';
        rawTextSection.style.display = 'none';
        statusDiv.innerHTML = '';
      } else {
        // Multi-file: auto-process without showing read button
        readBtn.style.display = 'none';
        exportBtn.style.display = 'none';
        resultsDiv.style.display = 'none';
        rawTextSection.style.display = 'none';
        statusDiv.innerHTML = '<div class="status warning">⏳ Processing report...</div>';

        await processFile(file);
        currentFileIndex++;
        setTimeout(() => processQueue(), 1500);
      }
    }

    async function processFile(file) {
      let parsed = null;
      try {
        const fileType = file.type;
        let text = '';

        if (fileType === 'application/pdf') {
          text = await extractTextFromPDF(file);
        } else if (fileType.startsWith('image/')) {
          text = await extractTextFromImage(file);
        } else {
          throw new Error('Unsupported file type');
        }

        rawExtractedText = text;
        console.log('RAW EXTRACTED TEXT:');
        console.log('='.repeat(80));
        console.log(text);
        console.log('='.repeat(80));
        console.log(`Raw text extracted: ${text.length} characters`);

        parsed = parseReport(text);

        if (parsed.valid) {
          extractedData = parsed;
          displayResults(parsed);
          displayRawText(text);
          statusDiv.innerHTML = `<div class="status success">✓ Checksum PASS — batch ${parsed.batch}: ${parsed.entries.length} rows, ${parsed.totalFootage.toFixed(2)} ft matches report Sum ${parsed.expectedSum.toFixed(2)} (${parsed.detailRecordsN} detail records)</div>`;
          exportBtn.style.display = 'block';
          // Collect for consolidation
          allParsedData.push(parsed);
        } else {
          extractedData = null;
          resultsDiv.style.display = 'none';
          exportBtn.style.display = 'none';
          displayValidationFailure(parsed);
          displayRawText(text);
        }
      } catch (error) {
        console.error('Processing error:', error);
        statusDiv.innerHTML = `<div class="status error">❌ Error: ${error.message}</div>`;
      }
    }

    function consolidateAndExport() {
      if (allParsedData.length === 0) return;

      // Combine all entries from all parsed data
      const allEntries = [];
      const allEntriesWithDisplay = [];
      let totalOriginalFootage = 0;
      let totalDisplayFootage = 0;

      allParsedData.forEach(data => {
        allEntries.push(...data.entries);
        allEntriesWithDisplay.push(...data.entriesWithDisplay);
        totalOriginalFootage += data.totalFootage;
        totalDisplayFootage += data.entriesWithDisplay.reduce((sum, e) => sum + e.displayFootage, 0);
      });

      // Create consolidated data object
      const consolidatedData = {
        batch: allParsedData.map(d => d.batch).join(', '),
        reportDate: allParsedData[0].reportDate,
        entries: allEntries,
        entriesWithDisplay: allEntriesWithDisplay,
        totalFootage: totalOriginalFootage,
        expectedSum: null,
        detailRecordsN: allParsedData.reduce((t, d) => t + (d.detailRecordsN || 0), 0),
        summary: buildPaintSummary(allEntriesWithDisplay)
      };

      // Display consolidated results; the EXPORT button re-exports this same data
      extractedData = consolidatedData;
      displayResults(consolidatedData);
      exportBtn.style.display = 'block';

      const totalDisplayGallons = totalDisplayFootage / FT_PER_GALLON;
      statusDiv.innerHTML = `<div class="status success">✓ All reports consolidated: ${allEntries.length} total rows, ${totalDisplayFootage.toFixed(2)} ft (${totalDisplayGallons.toFixed(3)} gal)</div>`;

      // Auto-export consolidated file
      autoExportConsolidated(consolidatedData);
    }

    function buildPaintSummary(entries) {
      const summaryMap = {};
      entries.forEach(entry => {
        const key = `${entry.colour}|${entry.finish}`;
        if (!summaryMap[key]) {
          summaryMap[key] = { colour: entry.colour, finish: entry.finish, totalFootage: 0, displayFootage: 0 };
        }
        summaryMap[key].totalFootage += entry.totalLengthFt || 0;
        summaryMap[key].displayFootage += entry.displayFootage || 0;
        summaryMap[key].displayGallons = summaryMap[key].displayFootage / FT_PER_GALLON;
      });

      return Object.values(summaryMap).sort((a, b) => b.totalFootage - a.totalFootage);
    }

    function autoExportConsolidated(consolidatedData) {
      const fileData = consolidatedData.entriesWithDisplay.map(entry => {
        const displayFootage = entry.displayFootage;
        return {
          'ExType': removeEmDashes(entry.exType || ''),
          'Colour': removeEmDashes(entry.colour || ''),
          'Finish': removeEmDashes(entry.finish || ''),
          'SecondaryColour': removeEmDashes(entry.secondaryColour || ''),
          'Description': removeEmDashes(entry.description || ''),
          'BothSides': entry.bothSides ? 'Yes' : 'No',
          'TotalLengthFt': entry.totalLengthFt || 0,
          'LengthsCount': entry.lengthsCount || 0,
          'Gallons': +(displayFootage / FT_PER_GALLON).toFixed(3),
          'Batch#': consolidatedData.batch || '',
          'ReportDate': consolidatedData.reportDate || ''
        };
      });

      const originalTotalFootage = consolidatedData.entriesWithDisplay.reduce((sum, e) => sum + (e.totalLengthFt || 0), 0);
      const displayTotalFootage = consolidatedData.entriesWithDisplay.reduce((sum, e) => sum + e.displayFootage, 0);
      const displayTotalGallons = displayTotalFootage / FT_PER_GALLON;
      fileData.push({
        'ExType': '',
        'Colour': '',
        'Finish': '',
        'SecondaryColour': '',
        'Description': 'TOTAL (Consumption)',
        'BothSides': '',
        'TotalLengthFt': +originalTotalFootage.toFixed(2),
        'LengthsCount': '',
        'Gallons': +displayTotalGallons.toFixed(3),
        'Batch#': consolidatedData.batch || '',
        'ReportDate': consolidatedData.reportDate || ''
      });

      // Main batch table sheet (plain, no styling)
      const ws = XLSX.utils.json_to_sheet(fileData);
      ws['!cols'] = [
        { wch: 16 }, // ExType
        { wch: 16 }, // Colour
        { wch: 12 }, // Finish
        { wch: 16 }, // SecondaryColour
        { wch: 28 }, // Description
        { wch: 10 }, // BothSides
        { wch: 13 }, // TotalLengthFt
        { wch: 12 }, // LengthsCount
        { wch: 9 },  // Gallons
        { wch: 20 }, // Batch#
        { wch: 14 }  // ReportDate
      ];

      // Create workbook and add main sheet
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Paint Report');

      // ---- PAINT SUMMARY: separate sheet with bordered formatting ----
      const summary = consolidatedData.summary || [];
      const sumFootage = summary.reduce((t, s) => t + (s.totalFootage !== undefined ? s.totalFootage : (s.displayFootage || 0)), 0);
      const sumGallons = summary.reduce((t, s) => t + (s.displayGallons || 0), 0);

      const summaryAoa = [
        ['PAINT SUMMARY (Colour + Finish)', '', '', ''],
        ['Colour', 'Finish', 'Total Footage (ft)', 'Gallons'],
        ...summary.map(s => [
          removeEmDashes(s.colour || ''),
          removeEmDashes(s.finish || ''),
          +((s.totalFootage !== undefined ? s.totalFootage : (s.displayFootage || 0)).toFixed(2)),
          +((s.displayGallons || 0).toFixed(3))
        ]),
        ['TOTAL', '', +sumFootage.toFixed(2), +sumGallons.toFixed(3)]
      ];

      // Create summary sheet from array
      const wsSummary = XLSX.utils.aoa_to_sheet(summaryAoa);
      wsSummary['!cols'] = [
        { wch: 20 }, // Colour
        { wch: 16 }, // Finish
        { wch: 18 }, // Total Footage
        { wch: 12 }  // Gallons
      ];

      // Style the summary sheet (requires the xlsx-js-style build)
      const thin = { style: 'thin', color: { rgb: '000000' } };
      const borderAll = { top: thin, bottom: thin, left: thin, right: thin };

      for (let r = 0; r < summaryAoa.length; r++) {
        for (let c = 0; c < 4; c++) {
          const ref = XLSX.utils.encode_cell({ r: r, c: c });
          if (!wsSummary[ref]) wsSummary[ref] = { t: 's', v: '' };
          const style = {
            border: borderAll,
            alignment: { vertical: 'center', horizontal: c >= 2 ? 'right' : 'left' }
          };
          if (r === 0) {
            // Title bar
            style.font = { bold: true, sz: 12, color: { rgb: 'FFFFFF' } };
            style.fill = { patternType: 'solid', fgColor: { rgb: '2C3E50' } };
            style.alignment = { vertical: 'center', horizontal: 'left' };
          } else if (r === 1) {
            // Column header row
            style.font = { bold: true, color: { rgb: 'FFFFFF' } };
            style.fill = { patternType: 'solid', fgColor: { rgb: '4472C4' } };
          } else if (r === summaryAoa.length - 1) {
            // Grand total row
            style.font = { bold: true };
            style.fill = { patternType: 'solid', fgColor: { rgb: 'D9E1F2' } };
          }
          if (c >= 2 && r > 1) {
            style.numFmt = c === 2 ? '0.00' : '0.000';
          }
          wsSummary[ref].s = style;
        }
      }

      // Merge the title bar across the 4 summary columns
      wsSummary['!merges'] = [{ s: { r: 0, c: 0 }, e: { r: 0, c: 3 } }];

      // Add summary sheet to workbook
      XLSX.utils.book_append_sheet(wb, wsSummary, 'PaintSummary');

      const exportFileName = `PaintReport_Consolidated.xlsx`;
      XLSX.writeFile(wb, exportFileName);
    }

    readBtn.addEventListener('click', async () => {
      if (!currentFile) return;
      readBtn.disabled = true;
      allParsedData = [];
      await processFile(currentFile);
      readBtn.disabled = false;

      // For single file processing, consolidate and export after processing
      if (allParsedData.length > 0) {
        consolidateAndExport();
      }
    });

    function moveToNextFile() {
      currentFileIndex++;
      processQueue();
    }

    // Extract text from PDF
    async function extractTextFromPDF(file) {
      const arrayBuffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      
      let fullText = '';
      
      for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
        const page = await pdf.getPage(pageNum);
        const textContent = await page.getTextContent();
        
        // Check if text is actually present
        if (textContent.items.length > 0 && textContent.items.some(item => item.str.trim())) {
          // Text-based PDF - use text extraction
          console.log(`Page ${pageNum}: Text-based PDF detected`);
          
          // Reconstruct text by Y-position (lines). Items on the same visual
          // row jitter by ~1pt while rows sit >=17pt apart, so cluster by
          // Y-gap instead of exact rounding (which splits rows apart).
          const sortedItems = [...textContent.items].sort((a, b) => b.transform[5] - a.transform[5]);
          const lines = [];
          let currentLine = null;
          let currentY = null;
          for (const item of sortedItems) {
            const y = item.transform[5];
            if (currentLine === null || currentY - y > 3) {
              currentLine = [];
              lines.push(currentLine);
              currentY = y;
            }
            currentLine.push(item);
          }
          for (const line of lines) {
            line.sort((a, b) => a.transform[4] - b.transform[4]);
            fullText += line.map(item => item.str).join(' ') + '\n';
          }
        } else {
          // Scanned PDF - use OCR
          console.log(`Page ${pageNum}: Scanned PDF detected, using OCR`);
          const viewport = page.getViewport({ scale: 2.0 });
          const canvas = document.createElement('canvas');
          canvas.width = viewport.width;
          canvas.height = viewport.height;
          const context = canvas.getContext('2d');
          
          await page.render({ canvasContext: context, viewport: viewport }).promise;
          
          const { data: { text } } = await Tesseract.recognize(canvas, 'eng', {
            logger: m => console.log(m)
          });
          
          fullText += text + '\n';
        }
      }
      
      return fullText;
    }

    // Extract text from image
    async function extractTextFromImage(file) {
      statusDiv.innerHTML = '<div class="status warning">⏳ Running OCR on image...</div>';
      
      const { data: { text } } = await Tesseract.recognize(file, 'eng', {
        logger: m => console.log(m)
      });
      
      return text;
    }

    // Single parser for the Da Vinci "PaintReport Production" format.
    // Every record is two adjacent lines:
    //   Line 1: {ExType}-KV {Colour}~{Finish} | {SecondaryColour} {Code} Profile {ProfileCode}
    //   Line 2: ExType {ExType} {Description} Total Length(ft) {value} Lengths {count}
    // Anchor on line 2, then pair it with the line directly above. ExType is
    // NOT always a 4-digit number ("1118-REMOVE Fin", "2343Ext", "SDL1.125"),
    // colours contain spaces ("Comm Brown"), descriptions contain slashes
    // ("CAS/AWN", "1 1/4") — so no \d{4} anchors and no "/" or space splits.
    function parseReport(text) {
      const rawLines = text.split('\n').map(l => l.replace(/\s+/g, ' ').trim());
      // Page headers/footers appear mid-stream. "ExType and Colour" contains
      // "ExType" but is a column header, not a record anchor.
      const isNoise = l =>
        !l ||
        l === 'ExType and Colour' ||
        l === 'PaintReport' ||
        /^(Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday),.*Page \d+ of \d+$/.test(l);
      const lines = rawLines.filter(l => !isNoise(l));

      const result = {
        batch: '',
        summaryBatch: '',
        reportDate: '',
        detailRecordsN: null,   // "(N detail records)" — underlying DB rows, informational
        expectedSum: null,      // the report's own "Sum" checksum line
        entries: [],
        errors: [],
        totalFootage: 0,
        totalGallons: 0,
        sumTolerance: 0,
        valid: false
      };

      const dateMatch = text.match(/(?:Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday),\s+([A-Za-z]+\s+\d{1,2},\s+\d{4})/);
      if (dateMatch) result.reportDate = dateMatch[1];

      const ANCHOR = /^ExType (.+?) Total Length\(ft\) ([\d,]*\.?\d+) Lengths (\d+)$/;

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        let m;

        if ((m = line.match(/^Production (\S+)$/))) { result.batch = m[1]; continue; }
        if ((m = line.match(/^Summary for 'Production' = (\S+) \((\d+) detail records\)$/))) {
          result.summaryBatch = m[1];
          result.detailRecordsN = parseInt(m[2], 10);
          continue;
        }
        if ((m = line.match(/^Sum ([\d,]+(?:\.\d+)?)$/))) {
          result.expectedSum = parseFloat(m[1].replace(/,/g, ''));
          continue;
        }

        m = line.match(ANCHOR);
        if (!m) continue;

        const combined = m[1]; // "{ExType} {Description}"
        const totalLengthFt = parseFloat(m[2].replace(/,/g, ''));
        const lengthsCount = parseInt(m[3], 10);
        const colourLine = i > 0 ? lines[i - 1] : '';

        // Records are related only by adjacency: the colour line must sit
        // directly above and start with "{ExType}-{Brand} " (e.g. "-KV ", "-GENTEK ", etc).
        // Recover the ExType by trying each "- " (dash-space) in the colour line as the
        // ExType boundary and requiring the anchor's combined string to start with that prefix.
        // (ExTypes themselves can contain "-", e.g. "1118-REMOVE Fin".)
        let exType = null;
        let brandSeparatorEnd = -1;
        // Find all dash-space boundaries
        for (let dashPos = 0; dashPos < colourLine.length; dashPos++) {
          if (colourLine[dashPos] === '-' && colourLine[dashPos + 1] !== ' ') {
            // Found a dash followed by non-space (potential brand name start)
            // Find the next space
            let spacePos = dashPos + 1;
            while (spacePos < colourLine.length && colourLine[spacePos] !== ' ') spacePos++;
            if (spacePos < colourLine.length && colourLine[spacePos] === ' ') {
              // This is a "-{BRAND} " boundary
              const candidate = colourLine.substring(0, dashPos);
              if (combined === candidate || combined.startsWith(candidate + ' ')) {
                exType = candidate;
                brandSeparatorEnd = spacePos + 1;
                break;
              }
            }
          }
        }
        if (exType === null) {
          result.errors.push(`Record ${result.entries.length + 1}: data line "${line}" is not preceded by a matching colour line (line above was: "${colourLine}")`);
          continue;
        }
        const description = combined.substring(exType.length).trim();

        // Rest of colour line: "{Colour}~{Finish} | {Secondary} {Code} Profile {ProfileCode}"
        // Split on "~" only — colour names contain spaces. Secondary colour is
        // sometimes absent (no "|", trailing space after "Profile").
        const rest = colourLine.substring(brandSeparatorEnd);
        const tilde = rest.indexOf('~');
        if (tilde === -1) {
          result.errors.push(`Record ${result.entries.length + 1}: no "~" separator in colour line "${colourLine}"`);
          continue;
        }
        const colour = rest.substring(0, tilde).trim();
        const afterTilde = rest.substring(tilde + 1);
        let finish, secondaryColour;
        const pipe = afterTilde.indexOf('|');
        if (pipe !== -1) {
          finish = afterTilde.substring(0, pipe).trim();
          secondaryColour = afterTilde.substring(pipe + 1).replace(/\s*Profile\s*\S*$/, '').trim();
        } else {
          finish = afterTilde.replace(/\s*Profile\s*\S*$/, '').trim();
          secondaryColour = '';
        }

        // When secondary colour is absent, both sides have the same paint.
        // Flag this; footage will be doubled for consumption display later.
        const bothSides = secondaryColour === '';
        result.entries.push({ exType, colour, finish, secondaryColour, description, totalLengthFt, lengthsCount, bothSides });
      }

      result.totalFootage = result.entries.reduce((sum, e) => sum + e.totalLengthFt, 0);
      result.totalGallons = result.totalFootage / FT_PER_GALLON;

      // Calculate display footages (doubled for BothSides) for sorting and summary
      const displayFootages = result.entries.map(e => ({
        ...e,
        displayFootage: e.bothSides ? e.totalLengthFt * 2 : e.totalLengthFt
      }));

      // Sort by display footage descending (highest to lowest)
      displayFootages.sort((a, b) => b.displayFootage - a.displayFootage);
      result.entriesWithDisplay = displayFootages;

      // Build summary: aggregate by Colour + Finish using display footages
      const summaryMap = {};
      for (const entry of displayFootages) {
        const key = `${entry.colour}~${entry.finish}`;
        if (!summaryMap[key]) {
          summaryMap[key] = { colour: entry.colour, finish: entry.finish, displayFootage: 0 };
        }
        summaryMap[key].displayFootage += entry.displayFootage;
      }
      result.summary = Object.values(summaryMap)
        .map(s => ({ ...s, displayGallons: s.displayFootage / FT_PER_GALLON }))
        .sort((a, b) => b.displayFootage - a.displayFootage);

      validateReport(result, lines);
      return result;
    }

    // MANDATORY CHECKSUM VALIDATION against the report's own summary lines.
    // A partial parse must never look like a success.
    function validateReport(result, lines) {
      if (result.entries.length === 0) {
        result.errors.push('No records found — the "ExType … Total Length(ft) … Lengths …" anchor never matched.');
      }
      if (result.detailRecordsN === null) {
        result.errors.push(`"Summary for 'Production'" line not found — report may be truncated or a different format.`);
      }
      if (result.expectedSum === null) {
        result.errors.push('Report "Sum" checksum line not found — report may be truncated or a different format.');
      }
      if (result.batch && result.summaryBatch && result.batch !== result.summaryBatch) {
        result.errors.push(`Batch mismatch: report header says ${result.batch} but summary says ${result.summaryBatch}.`);
      }

      // Structural pairing: every record is exactly one colour line + one data
      // line. A colour line whose data line was lost (or vice versa) shifts
      // adjacency, so the counts must match 1:1.
      // Colour lines have format: ExType-{Brand} {Colour}~{Finish}... where
      // {Brand} is any non-space token (KV, GENTEK, ...) — keep this in sync
      // with the parser's boundary scan, which accepts any brand token.
      const colourLineCount = lines.filter(l => /-\S+\s+[^~]*~/.test(l)).length;
      if (colourLineCount !== result.entries.length) {
        result.errors.push(`Structural mismatch: found ${colourLineCount} colour lines but parsed ${result.entries.length} records — one or more lines were lost or misread.`);
      }

      // Sum checksum. Printed per-row footages are rounded to 1 decimal while
      // the report Sum has 2 decimals, so the max legitimate drift is 0.05/row.
      if (result.expectedSum !== null) {
        result.sumTolerance = 0.05 * result.entries.length + 0.005;
        const diff = Math.abs(result.totalFootage - result.expectedSum);
        if (diff > result.sumTolerance) {
          result.errors.push(`CHECKSUM FAILURE: parsed rows sum to ${result.totalFootage.toFixed(2)} ft but the report Sum is ${result.expectedSum.toFixed(2)} ft — difference ${diff.toFixed(2)} exceeds rounding tolerance ${result.sumTolerance.toFixed(2)}. One or more records were missed or misread.`);
        }
      }

      result.valid = result.errors.length === 0;
    }

    function escapeHtml(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function displayValidationFailure(parsed) {
      const errorItems = parsed.errors.map(e => `<li>${escapeHtml(e)}</li>`).join('');
      statusDiv.innerHTML = `
        <div class="status error">
          ❌ <strong>CHECKSUM VALIDATION FAILED — results withheld.</strong><br><br>
          Batch: ${escapeHtml(parsed.batch || '(not found)')}
          &nbsp;|&nbsp; Rows parsed: ${parsed.entries.length}
          &nbsp;|&nbsp; Parsed sum: ${parsed.totalFootage.toFixed(2)} ft
          &nbsp;|&nbsp; Report Sum: ${parsed.expectedSum !== null ? parsed.expectedSum.toFixed(2) + ' ft' : '(not found)'}
          &nbsp;|&nbsp; Detail records: ${parsed.detailRecordsN !== null ? parsed.detailRecordsN : '(not found)'}
          <ul style="margin: 12px 0 0 20px;">${errorItems}</ul>
        </div>
        <div class="status warning">
          The parsed data does not reconcile with the report's own summary, so the
          results table and Excel export are disabled. Check the raw text below.
        </div>
      `;
    }

    function removeEmDashes(s) {
      return String(s).replace(/—/g, '-');
    }

    function displayResults(data) {
      // Calculate display totals (with BothSides doubling)
      const displayTotalFootage = data.entriesWithDisplay.reduce((sum, e) => sum + e.displayFootage, 0);
      const displayTotalGallons = displayTotalFootage / FT_PER_GALLON;

      let html = `<div class="result-header">Production ${escapeHtml(removeEmDashes(data.batch))}`;
      if (data.reportDate) {
        html += ` - ${escapeHtml(removeEmDashes(data.reportDate))}`;
      }
      html += ` - ${data.entries.length} rows`;
      if (data.detailRecordsN) {
        html += ` (${data.detailRecordsN} detail records)`;
      }
      html += `</div>`;

      html += `<table class="result-table">
        <thead>
          <tr>
            <th>ExType</th>
            <th>Colour</th>
            <th>Finish</th>
            <th>Secondary</th>
            <th>Description</th>
            <th>Both Sides</th>
            <th>Lengths</th>
            <th>Footage</th>
            <th>Gallons</th>
          </tr>
        </thead>
        <tbody>`;

      data.entriesWithDisplay.forEach(entry => {
        const displayFootage = entry.displayFootage;
        const gallons = (displayFootage / FT_PER_GALLON).toFixed(3);
        const bothSidesLabel = entry.bothSides ? 'Yes' : 'No';
        html += `
          <tr>
            <td>${escapeHtml(removeEmDashes(entry.exType))}</td>
            <td>${escapeHtml(removeEmDashes(entry.colour))}</td>
            <td>${escapeHtml(removeEmDashes(entry.finish))}</td>
            <td>${escapeHtml(removeEmDashes(entry.secondaryColour)) || '-'}</td>
            <td>${escapeHtml(removeEmDashes(entry.description)) || '-'}</td>
            <td>${bothSidesLabel}</td>
            <td>${entry.lengthsCount}</td>
            <td>${displayFootage.toFixed(2)}</td>
            <td>${gallons}</td>
          </tr>`;
      });

      html += `
          <tr class="totals-row">
            <td colspan="7"><strong>TOTALS (Consumption)</strong></td>
            <td><strong>${displayTotalFootage.toFixed(2)} ft</strong></td>
            <td><strong>${displayTotalGallons.toFixed(3)} gal</strong></td>
          </tr>
        </tbody>
      </table>`;

      // Paint summary by Colour + Finish
      if (data.summary && data.summary.length > 0) {
        html += `<div style="margin-top: 30px;"><div class="result-header">Paint Summary (by Colour + Finish)</div>`;
        html += `<table class="result-table">
          <thead>
            <tr>
              <th>Colour</th>
              <th>Finish</th>
              <th>Total Footage</th>
              <th>Total Gallons</th>
            </tr>
          </thead>
          <tbody>`;

        data.summary.forEach(s => {
          const gallons = s.displayGallons.toFixed(3);
          html += `
            <tr>
              <td>${escapeHtml(removeEmDashes(s.colour))}</td>
              <td>${escapeHtml(removeEmDashes(s.finish))}</td>
              <td><strong>${s.displayFootage.toFixed(2)} ft</strong></td>
              <td><strong>${gallons} gal</strong></td>
            </tr>`;
        });

        html += `
          </tbody>
        </table></div>`;
      }

      resultsDiv.innerHTML = html;
      resultsDiv.style.display = 'block';
    }

    function displayRawText(text) {
      rawTextSection.innerHTML = `
        <h3>Raw Extracted Text (first 721 characters):</h3>
        <pre>${text.substring(0, 721)}</pre>
      `;
      rawTextSection.style.display = 'block';
    }

exportBtn.addEventListener('click', () => {
      if (!extractedData) return;
      autoExportConsolidated(extractedData);
      statusDiv.innerHTML = `<div class="status success">✓ Exported to PaintReport_Consolidated.xlsx</div>`;
    });
  </script>
</body>
</html>
