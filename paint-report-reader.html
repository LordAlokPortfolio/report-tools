<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paint Report Reader</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      min-height: 100vh;
      padding: 20px;
      color: #fff;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #ff6b35 0%, #ff8c42 100%);
      padding: 30px;
      text-align: center;
    }

    .header h1 {
      font-size: 32px;
      margin-bottom: 8px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
    }

    .header p {
      font-size: 14px;
      opacity: 0.95;
      font-weight: 500;
    }

    .badge {
      display: inline-block;
      background: rgba(255, 255, 255, 0.25);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      margin-top: 10px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .content {
      padding: 40px;
      color: #333;
    }

    .upload-zone {
      border: 3px dashed #ccc;
      border-radius: 8px;
      padding: 50px 30px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      background: #f9f9f9;
      margin-bottom: 30px;
    }

    .upload-zone:hover {
      border-color: #ff6b35;
      background: #fff5f2;
    }

    .upload-zone.dragover {
      border-color: #ff6b35;
      background: #fff5f2;
      transform: scale(1.02);
    }

    .upload-icon {
      font-size: 64px;
      margin-bottom: 15px;
    }

    .upload-text {
      font-size: 18px;
      color: #555;
      margin-bottom: 8px;
    }

    .upload-hint {
      font-size: 14px;
      color: #888;
    }

    .file-input {
      display: none;
    }

    .btn {
      background: linear-gradient(135deg, #ff6b35 0%, #ff8c42 100%);
      color: white;
      border: none;
      padding: 15px 40px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      box-shadow: 0 4px 12px rgba(255, 107, 53, 0.3);
      transition: all 0.3s ease;
      width: 100%;
      margin-top: 20px;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(255, 107, 53, 0.4);
    }

    .btn:disabled {
      background: #ccc;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    .file-info {
      background: #e8f4f8;
      padding: 15px;
      border-radius: 6px;
      margin: 20px 0;
      border-left: 4px solid #3498db;
    }

    .file-name {
      font-weight: 600;
      color: #2c3e50;
      margin-bottom: 5px;
    }

    .file-size {
      font-size: 14px;
      color: #7f8c8d;
    }

    .status {
      padding: 15px;
      border-radius: 6px;
      margin: 15px 0;
      font-weight: 500;
    }

    .status.success {
      background: #d4edda;
      color: #155724;
      border-left: 4px solid #28a745;
    }

    .status.error {
      background: #f8d7da;
      color: #721c24;
      border-left: 4px solid #dc3545;
    }

    .status.warning {
      background: #fff3cd;
      color: #856404;
      border-left: 4px solid #ffc107;
    }

    .results {
      margin-top: 30px;
    }

    .result-header {
      background: #2c3e50;
      color: white;
      padding: 15px 20px;
      border-radius: 6px 6px 0 0;
      font-weight: 600;
      font-size: 18px;
    }

    .result-table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .result-table th {
      background: #34495e;
      color: white;
      padding: 12px;
      text-align: left;
      font-weight: 600;
      font-size: 14px;
    }

    .result-table td {
      padding: 12px;
      border-bottom: 1px solid #ecf0f1;
      font-size: 14px;
    }

    .result-table tr:last-child td {
      border-bottom: none;
    }

    .result-table tr:hover {
      background: #f8f9fa;
    }

    .totals-row {
      background: #e8f4f8 !important;
      font-weight: 700;
      color: #2c3e50;
    }

    .totals-row td {
      border-top: 2px solid #3498db;
    }

    .raw-text-section {
      margin-top: 20px;
      padding: 15px;
      background: #f5f5f5;
      border-radius: 6px;
      max-height: 300px;
      overflow-y: auto;
    }

    .raw-text-section h3 {
      color: #2c3e50;
      margin-bottom: 10px;
      font-size: 16px;
    }

    .raw-text-section pre {
      background: white;
      padding: 15px;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      color: #333;
      white-space: pre-wrap;
      word-wrap: break-word;
      border: 1px solid #ddd;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🎨 PAINT REPORT READER</h1>
      <p>VINYL EXTRUSION TRACKER</p>
      <div class="badge">100% LOCAL - NO DATA LEAVES YOUR COMPUTER - NO INTERNET REQUIRED AFTER LOAD</div>
    </div>

    <div class="content">
      <div class="upload-zone" id="uploadZone">
        <div class="upload-icon">📄</div>
        <div class="upload-text">DROP PAINT REPORT HERE</div>
        <div class="upload-hint">PDF (text or scanned) · JPG · PNG · Any photo of the report</div>
      </div>

      <input type="file" id="fileInput" class="file-input" accept=".pdf,.jpg,.jpeg,.png">

      <div id="fileInfo" style="display: none;"></div>
      <div id="status"></div>

      <button id="readBtn" class="btn" style="display: none;">READ REPORT</button>
      <button id="exportBtn" class="btn" style="display: none;">EXPORT TO EXCEL</button>

      <div id="results" class="results" style="display: none;"></div>
      <div id="rawTextSection" class="raw-text-section" style="display: none;"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    // PLACEHOLDER — to be replaced with per-surface paint rate constants.
    const FT_PER_GALLON = 400;

    let currentFile = null;
    let extractedData = null;
    let rawExtractedText = '';

    const uploadZone = document.getElementById('uploadZone');
    const fileInput = document.getElementById('fileInput');
    const readBtn = document.getElementById('readBtn');
    const exportBtn = document.getElementById('exportBtn');
    const fileInfo = document.getElementById('fileInfo');
    const statusDiv = document.getElementById('status');
    const resultsDiv = document.getElementById('results');
    const rawTextSection = document.getElementById('rawTextSection');

    // Upload zone interactions
    uploadZone.addEventListener('click', () => fileInput.click());
    
    uploadZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadZone.classList.add('dragover');
    });
    
    uploadZone.addEventListener('dragleave', () => {
      uploadZone.classList.remove('dragover');
    });
    
    uploadZone.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadZone.classList.remove('dragover');
      if (e.dataTransfer.files.length > 0) {
        handleFile(e.dataTransfer.files[0]);
      }
    });

    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        handleFile(e.target.files[0]);
      }
    });

    function handleFile(file) {
      currentFile = file;
      
      fileInfo.innerHTML = `
        <div class="file-name">✓ ${file.name}</div>
        <div class="file-size">${(file.size / 1024).toFixed(2)} KB</div>
      `;
      fileInfo.style.display = 'block';
      
      readBtn.style.display = 'block';
      exportBtn.style.display = 'none';
      resultsDiv.style.display = 'none';
      rawTextSection.style.display = 'none';
      statusDiv.innerHTML = '';
    }

    readBtn.addEventListener('click', async () => {
      if (!currentFile) return;

      readBtn.disabled = true;
      statusDiv.innerHTML = '<div class="status warning">⏳ Processing report...</div>';

      try {
        const fileType = currentFile.type;
        let text = '';

        if (fileType === 'application/pdf') {
          text = await extractTextFromPDF(currentFile);
        } else if (fileType.startsWith('image/')) {
          text = await extractTextFromImage(currentFile);
        } else {
          throw new Error('Unsupported file type');
        }

        rawExtractedText = text;
        console.log('RAW EXTRACTED TEXT:');
        console.log('='.repeat(80));
        console.log(text);
        console.log('='.repeat(80));
        console.log(`Raw text extracted: ${text.length} characters`);

        const parsed = parseReport(text);

        if (parsed.valid) {
          extractedData = parsed;
          displayResults(parsed);
          displayRawText(text);
          statusDiv.innerHTML = `<div class="status success">✓ Checksum PASS — batch ${parsed.batch}: ${parsed.entries.length} rows, ${parsed.totalFootage.toFixed(2)} ft matches report Sum ${parsed.expectedSum.toFixed(2)} (${parsed.detailRecordsN} detail records)</div>`;
          exportBtn.style.display = 'block';
        } else {
          // Validation failed: no results table, no Excel export.
          extractedData = null;
          resultsDiv.style.display = 'none';
          exportBtn.style.display = 'none';
          displayValidationFailure(parsed);
          displayRawText(text);
        }
      } catch (error) {
        console.error('Processing error:', error);
        statusDiv.innerHTML = `<div class="status error">❌ Error: ${error.message}</div>`;
      } finally {
        readBtn.disabled = false;
      }
    });

    // Extract text from PDF
    async function extractTextFromPDF(file) {
      const arrayBuffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      
      let fullText = '';
      
      for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
        const page = await pdf.getPage(pageNum);
        const textContent = await page.getTextContent();
        
        // Check if text is actually present
        if (textContent.items.length > 0 && textContent.items.some(item => item.str.trim())) {
          // Text-based PDF - use text extraction
          console.log(`Page ${pageNum}: Text-based PDF detected`);
          
          // Reconstruct text by Y-position (lines). Items on the same visual
          // row jitter by ~1pt while rows sit >=17pt apart, so cluster by
          // Y-gap instead of exact rounding (which splits rows apart).
          const sortedItems = [...textContent.items].sort((a, b) => b.transform[5] - a.transform[5]);
          const lines = [];
          let currentLine = null;
          let currentY = null;
          for (const item of sortedItems) {
            const y = item.transform[5];
            if (currentLine === null || currentY - y > 3) {
              currentLine = [];
              lines.push(currentLine);
              currentY = y;
            }
            currentLine.push(item);
          }
          for (const line of lines) {
            line.sort((a, b) => a.transform[4] - b.transform[4]);
            fullText += line.map(item => item.str).join(' ') + '\n';
          }
        } else {
          // Scanned PDF - use OCR
          console.log(`Page ${pageNum}: Scanned PDF detected, using OCR`);
          const viewport = page.getViewport({ scale: 2.0 });
          const canvas = document.createElement('canvas');
          canvas.width = viewport.width;
          canvas.height = viewport.height;
          const context = canvas.getContext('2d');
          
          await page.render({ canvasContext: context, viewport: viewport }).promise;
          
          const { data: { text } } = await Tesseract.recognize(canvas, 'eng', {
            logger: m => console.log(m)
          });
          
          fullText += text + '\n';
        }
      }
      
      return fullText;
    }

    // Extract text from image
    async function extractTextFromImage(file) {
      statusDiv.innerHTML = '<div class="status warning">⏳ Running OCR on image...</div>';
      
      const { data: { text } } = await Tesseract.recognize(file, 'eng', {
        logger: m => console.log(m)
      });
      
      return text;
    }

    // Single parser for the Da Vinci "PaintReport Production" format.
    // Every record is two adjacent lines:
    //   Line 1: {ExType}-KV {Colour}~{Finish} | {SecondaryColour} {Code} Profile {ProfileCode}
    //   Line 2: ExType {ExType} {Description} Total Length(ft) {value} Lengths {count}
    // Anchor on line 2, then pair it with the line directly above. ExType is
    // NOT always a 4-digit number ("1118-REMOVE Fin", "2343Ext", "SDL1.125"),
    // colours contain spaces ("Comm Brown"), descriptions contain slashes
    // ("CAS/AWN", "1 1/4") — so no \d{4} anchors and no "/" or space splits.
    function parseReport(text) {
      const rawLines = text.split('\n').map(l => l.replace(/\s+/g, ' ').trim());
      // Page headers/footers appear mid-stream. "ExType and Colour" contains
      // "ExType" but is a column header, not a record anchor.
      const isNoise = l =>
        !l ||
        l === 'ExType and Colour' ||
        l === 'PaintReport' ||
        /^(Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday),.*Page \d+ of \d+$/.test(l);
      const lines = rawLines.filter(l => !isNoise(l));

      const result = {
        batch: '',
        summaryBatch: '',
        reportDate: '',
        detailRecordsN: null,   // "(N detail records)" — underlying DB rows, informational
        expectedSum: null,      // the report's own "Sum" checksum line
        entries: [],
        errors: [],
        totalFootage: 0,
        totalGallons: 0,
        sumTolerance: 0,
        valid: false
      };

      const dateMatch = text.match(/(?:Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday),\s+([A-Za-z]+\s+\d{1,2},\s+\d{4})/);
      if (dateMatch) result.reportDate = dateMatch[1];

      const ANCHOR = /^ExType (.+?) Total Length\(ft\) ([\d,]*\.?\d+) Lengths (\d+)$/;

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        let m;

        if ((m = line.match(/^Production (\S+)$/))) { result.batch = m[1]; continue; }
        if ((m = line.match(/^Summary for 'Production' = (\S+) \((\d+) detail records\)$/))) {
          result.summaryBatch = m[1];
          result.detailRecordsN = parseInt(m[2], 10);
          continue;
        }
        if ((m = line.match(/^Sum ([\d,]+(?:\.\d+)?)$/))) {
          result.expectedSum = parseFloat(m[1].replace(/,/g, ''));
          continue;
        }

        m = line.match(ANCHOR);
        if (!m) continue;

        const combined = m[1]; // "{ExType} {Description}"
        const totalLengthFt = parseFloat(m[2].replace(/,/g, ''));
        const lengthsCount = parseInt(m[3], 10);
        const colourLine = i > 0 ? lines[i - 1] : '';

        // Records are related only by adjacency: the colour line must sit
        // directly above and start with "{ExType}-KV ". Recover the ExType by
        // trying each "-KV " in the colour line as the ExType boundary and
        // requiring the anchor's combined string to start with that prefix.
        // (ExTypes themselves can contain "-", e.g. "1118-REMOVE Fin".)
        let exType = null;
        let kvPos = -1;
        while ((kvPos = colourLine.indexOf('-KV ', kvPos + 1)) !== -1) {
          const candidate = colourLine.substring(0, kvPos);
          if (combined === candidate || combined.startsWith(candidate + ' ')) {
            exType = candidate;
            break;
          }
        }
        if (exType === null) {
          result.errors.push(`Record ${result.entries.length + 1}: data line "${line}" is not preceded by a matching colour line (line above was: "${colourLine}")`);
          continue;
        }
        const description = combined.substring(exType.length).trim();

        // Rest of colour line: "{Colour}~{Finish} | {Secondary} {Code} Profile {ProfileCode}"
        // Split on "~" only — colour names contain spaces. Secondary colour is
        // sometimes absent (no "|", trailing space after "Profile").
        const rest = colourLine.substring(exType.length + '-KV '.length);
        const tilde = rest.indexOf('~');
        if (tilde === -1) {
          result.errors.push(`Record ${result.entries.length + 1}: no "~" separator in colour line "${colourLine}"`);
          continue;
        }
        const colour = rest.substring(0, tilde).trim();
        const afterTilde = rest.substring(tilde + 1);
        let finish, secondaryColour;
        const pipe = afterTilde.indexOf('|');
        if (pipe !== -1) {
          finish = afterTilde.substring(0, pipe).trim();
          secondaryColour = afterTilde.substring(pipe + 1).replace(/\s*Profile\s*\S*$/, '').trim();
        } else {
          finish = afterTilde.replace(/\s*Profile\s*\S*$/, '').trim();
          secondaryColour = '';
        }

        // Never deduplicate — the same ExType legitimately repeats per colour.
        result.entries.push({ exType, colour, finish, secondaryColour, description, totalLengthFt, lengthsCount });
      }

      result.totalFootage = result.entries.reduce((sum, e) => sum + e.totalLengthFt, 0);
      result.totalGallons = result.totalFootage / FT_PER_GALLON;

      validateReport(result, lines);
      return result;
    }

    // MANDATORY CHECKSUM VALIDATION against the report's own summary lines.
    // A partial parse must never look like a success.
    function validateReport(result, lines) {
      if (result.entries.length === 0) {
        result.errors.push('No records found — the "ExType … Total Length(ft) … Lengths …" anchor never matched.');
      }
      if (result.detailRecordsN === null) {
        result.errors.push(`"Summary for 'Production'" line not found — report may be truncated or a different format.`);
      }
      if (result.expectedSum === null) {
        result.errors.push('Report "Sum" checksum line not found — report may be truncated or a different format.');
      }
      if (result.batch && result.summaryBatch && result.batch !== result.summaryBatch) {
        result.errors.push(`Batch mismatch: report header says ${result.batch} but summary says ${result.summaryBatch}.`);
      }

      // Structural pairing: every record is exactly one colour line + one data
      // line. A colour line whose data line was lost (or vice versa) shifts
      // adjacency, so the counts must match 1:1.
      const colourLineCount = lines.filter(l => /-KV [^~]*~/.test(l)).length;
      if (colourLineCount !== result.entries.length) {
        result.errors.push(`Structural mismatch: found ${colourLineCount} colour lines but parsed ${result.entries.length} records — one or more lines were lost or misread.`);
      }

      // Sum checksum. Printed per-row footages are rounded to 1 decimal while
      // the report Sum has 2 decimals, so the max legitimate drift is 0.05/row.
      if (result.expectedSum !== null) {
        result.sumTolerance = 0.05 * result.entries.length + 0.005;
        const diff = Math.abs(result.totalFootage - result.expectedSum);
        if (diff > result.sumTolerance) {
          result.errors.push(`CHECKSUM FAILURE: parsed rows sum to ${result.totalFootage.toFixed(2)} ft but the report Sum is ${result.expectedSum.toFixed(2)} ft — difference ${diff.toFixed(2)} exceeds rounding tolerance ${result.sumTolerance.toFixed(2)}. One or more records were missed or misread.`);
        }
      }

      result.valid = result.errors.length === 0;
    }

    function escapeHtml(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function displayValidationFailure(parsed) {
      const errorItems = parsed.errors.map(e => `<li>${escapeHtml(e)}</li>`).join('');
      statusDiv.innerHTML = `
        <div class="status error">
          ❌ <strong>CHECKSUM VALIDATION FAILED — results withheld.</strong><br><br>
          Batch: ${escapeHtml(parsed.batch || '(not found)')}
          &nbsp;|&nbsp; Rows parsed: ${parsed.entries.length}
          &nbsp;|&nbsp; Parsed sum: ${parsed.totalFootage.toFixed(2)} ft
          &nbsp;|&nbsp; Report Sum: ${parsed.expectedSum !== null ? parsed.expectedSum.toFixed(2) + ' ft' : '(not found)'}
          &nbsp;|&nbsp; Detail records: ${parsed.detailRecordsN !== null ? parsed.detailRecordsN : '(not found)'}
          <ul style="margin: 12px 0 0 20px;">${errorItems}</ul>
        </div>
        <div class="status warning">
          The parsed data does not reconcile with the report's own summary, so the
          results table and Excel export are disabled. Check the raw text below.
        </div>
      `;
    }

    function displayResults(data) {
      let html = `<div class="result-header">Production ${escapeHtml(data.batch)}`;
      if (data.reportDate) {
        html += ` — ${escapeHtml(data.reportDate)}`;
      }
      html += ` — ${data.entries.length} rows (${data.detailRecordsN} detail records)</div>`;

      html += `<table class="result-table">
        <thead>
          <tr>
            <th>ExType</th>
            <th>Colour</th>
            <th>Finish</th>
            <th>Secondary</th>
            <th>Description</th>
            <th>Lengths</th>
            <th>Footage</th>
            <th>Gallons</th>
          </tr>
        </thead>
        <tbody>`;

      data.entries.forEach(entry => {
        const gallons = (entry.totalLengthFt / FT_PER_GALLON).toFixed(3);
        html += `
          <tr>
            <td>${escapeHtml(entry.exType)}</td>
            <td>${escapeHtml(entry.colour)}</td>
            <td>${escapeHtml(entry.finish)}</td>
            <td>${escapeHtml(entry.secondaryColour) || '-'}</td>
            <td>${escapeHtml(entry.description) || '-'}</td>
            <td>${entry.lengthsCount}</td>
            <td>${entry.totalLengthFt.toFixed(2)}</td>
            <td>${gallons}</td>
          </tr>`;
      });

      html += `
          <tr class="totals-row">
            <td colspan="6"><strong>TOTALS</strong></td>
            <td><strong>${data.totalFootage.toFixed(2)} ft</strong></td>
            <td><strong>${data.totalGallons.toFixed(3)} gal</strong></td>
          </tr>
        </tbody>
      </table>`;

      resultsDiv.innerHTML = html;
      resultsDiv.style.display = 'block';
    }

    function displayRawText(text) {
      rawTextSection.innerHTML = `
        <h3>Raw Extracted Text (first 721 characters):</h3>
        <pre>${text.substring(0, 721)}</pre>
      `;
      rawTextSection.style.display = 'block';
    }

    exportBtn.addEventListener('click', () => {
      if (!extractedData) return;

      const data = extractedData.entries.map(entry => ({
        'ExType': entry.exType,
        'Colour': entry.colour,
        'Finish': entry.finish,
        'SecondaryColour': entry.secondaryColour,
        'Description': entry.description,
        'TotalLengthFt': entry.totalLengthFt,
        'LengthsCount': entry.lengthsCount,
        'Gallons': +(entry.totalLengthFt / FT_PER_GALLON).toFixed(3),
        'Batch#': extractedData.batch,
        'ReportDate': extractedData.reportDate
      }));

      // Add totals row
      data.push({
        'ExType': '',
        'Colour': '',
        'Finish': '',
        'SecondaryColour': '',
        'Description': 'TOTAL',
        'TotalLengthFt': +extractedData.totalFootage.toFixed(2),
        'LengthsCount': '',
        'Gallons': +extractedData.totalGallons.toFixed(3),
        'Batch#': extractedData.batch,
        'ReportDate': extractedData.reportDate
      });

      const ws = XLSX.utils.json_to_sheet(data);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Paint Report');

      const fileName = `PaintReport_${extractedData.batch}.xlsx`;
      XLSX.writeFile(wb, fileName);

      statusDiv.innerHTML = `<div class="status success">✓ Exported to ${fileName}</div>`;
    });
  </script>
</body>
</html>
