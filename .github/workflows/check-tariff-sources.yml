name: Check tariff sources

on:
  schedule:
    # 11:00 UTC daily (~07:00 ET) - after overnight government publishing.
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-sources:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run source check
        run: node scripts/check-sources.js

      - name: Commit and push data changes
        run: |
          if [ -z "$(git status --porcelain -- data)" ]; then
            echo "No changes to data/*.json - nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "chore: source check $(date -u +%Y-%m-%d) - see reviewNeeded flags"
          git push origin HEAD:main
