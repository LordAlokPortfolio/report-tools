<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Material Transfer Form</title>

<meta name="theme-color" content="#1e5a96">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial,sans-serif;
  background:#f1f3f5;
  padding:12px;
  color:#222;
}

.container{
  max-width:1000px;
  margin:auto;
  background:white;
  padding:16px;
  border-radius:6px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
  overflow:visible;
}

.header{
  text-align:center;
  background:#1e5a96;
  color:white;
  padding:16px;
  margin:-16px -16px 12px -16px;
  border-radius:6px 6px 0 0;
}

.header h1{
  font-size:22px;
  color:white;
  margin-bottom:4px;
  letter-spacing:0.5px;
}

.header p{
  font-size:12px;
  color:rgba(255,255,255,.85);
}

.two-col{
  display:grid;
  grid-template-columns:1fr 1fr;
  border:1px solid #d8d8d8;
  border-radius:4px;
  overflow:hidden;
  margin-bottom:10px;
  break-inside:avoid;
  page-break-inside:avoid;
}

.two-col .col-left{
  border-right:1px solid #d8d8d8;
}

.two-col .col-title{
  background:#1e5a96;
  color:white;
  padding:8px 10px;
  font-size:12px;
  font-weight:bold;
}

.two-col .col-body{
  padding:10px;
  background:#fafafa;
}

.two-col .form-group{
  margin-bottom:8px;
}

.two-col .form-group:last-child{
  margin-bottom:0;
}

.sig-row{
  display:grid;
  grid-template-columns:1.4fr 1.4fr 1fr;
  gap:10px;
  margin-bottom:10px;
}

.sig-row:last-child{
  margin-bottom:0;
}

.form-number-display{
  font-size:16px;
  font-weight:700;
  color:#1e5a96;
  font-family:monospace;
  background:rgba(30,90,150,0.1);
  padding:6px 10px;
  border-radius:4px;
  cursor:pointer;
  display:inline-block;
}

@media(max-width:768px){

  .two-col{
    grid-template-columns:1fr;
  }

  .two-col .col-left{
    border-right:none;
    border-bottom:1px solid #d8d8d8;
  }

  .sig-row{
    grid-template-columns:1fr;
  }
}

.form-section{
  border:1px solid #d8d8d8;
  border-radius:4px;
  overflow:hidden;
  margin-bottom:10px;
  break-inside:avoid;
  page-break-inside:avoid;
}

.section-title{
  background:#1e5a96;
  color:white;
  padding:8px 10px;
  font-size:12px;
  font-weight:bold;
}

.section-body{
  padding:10px;
  background:#fafafa;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:8px;
}

.form-group{
  display:flex;
  flex-direction:column;
}

.form-group label{
  font-size:11px;
  font-weight:bold;
  margin-bottom:4px;
  color:#1e5a96;
}

input,
textarea{
  width:100%;
  border:1px solid #cfcfcf;
  border-radius:4px;
  padding:6px;
  font-size:12px;
  font-family:inherit;
  background:white;
}

textarea{
  min-height:40px;
  resize:vertical;
}

table{
  width:100%;
  border-collapse:collapse;
  background:white;
  display:block;
  overflow-x:auto;
}

th{
  background:#34495e;
  color:white;
  padding:6px;
  font-size:11px;
  text-align:left;
  white-space:nowrap;
}

td{
  border:1px solid #ddd;
  padding:4px;
}

table input{
  width:100%;
  border:none;
  padding:4px;
  font-size:11px;
  min-width:70px;
}

.qty{
  text-align:right;
}

.summary{
  text-align:right;
  margin-top:8px;
  font-size:14px;
  font-weight:bold;
  color:#1e5a96;
}

.buttons{
  display:flex;
  gap:10px;
  justify-content:center;
  flex-wrap:wrap;
  margin-top:16px;
}

button{
  border:none;
  border-radius:4px;
  padding:10px 16px;
  font-size:12px;
  font-weight:bold;
  cursor:pointer;
}

.primary{
  background:#1e5a96;
  color:white;
}

.secondary{
  background:#777;
  color:white;
}

.danger{
  background:#c0392b;
  color:white;
  padding:6px 8px;
  font-size:10px;
}

@media(max-width:768px){

  .form-grid{
    grid-template-columns:1fr;
  }

  .buttons{
    flex-direction:column;
  }

  button{
    width:100%;
  }
}

/* PDF / PRINT */

@media print{

  body{
    background:white;
    padding:0;
  }

  .container{
    box-shadow:none;
    border-radius:0;
    max-width:100%;
    padding:4mm;
  }

  .buttons,
  .danger{
    display:none !important;
  }

  .form-section{
    margin-bottom:5px;
  }

  th{
    background:#34495e !important;
    color:white !important;
    print-color-adjust:exact;
  }

  .section-title,
  .two-col .col-title{
    background:#1e5a96 !important;
    color:white !important;
    print-color-adjust:exact;
  }

  .header{
    background:#1e5a96 !important;
    color:white !important;
    print-color-adjust:exact;
  }

  .header h1,
  .header p{
    color:white !important;
  }

  input,
  textarea{
    border:none;
    background:transparent;
    padding:0;
  }

  textarea{
    min-height:24px;
  }

  tr{
    break-inside:avoid;
    page-break-inside:avoid;
  }
}

</style>
</head>

<body>

<div class="container" id="pdfContent">

<div class="header">
  <h1>MATERIAL TRANSFER FORM</h1>
  <p>Internal Material Movement Record</p>
</div>

<div class="form-section">
  <div class="section-title">FORM INFORMATION</div>

  <div class="section-body">

    <div class="form-grid">

      <div class="form-group">
        <label>Form #</label>
        <div id="formNumberDisplay" class="form-number-display" onclick="startEditFormNumber()" title="Click to adjust the form number (e.g. after using this on another device)">MTF-0001</div>
      </div>

      <div class="form-group">
        <label>Date</label>
        <input type="date" id="formDate">
      </div>

    </div>

  </div>
</div>

<div class="two-col">

  <div class="col-left">
    <div class="col-title">FROM (Transferring Company)</div>
    <div class="col-body">
      <div class="form-group">
        <label>Company Name</label>
        <input type="text" id="fromCompanyName">
      </div>
      <div class="form-group">
        <label>Department</label>
        <input type="text" id="fromDepartment">
      </div>
      <div class="form-group">
        <label>Contact Person</label>
        <input type="text" id="fromContactPerson">
      </div>
      <div class="form-group">
        <label>Location / Suite</label>
        <input type="text" id="fromLocation">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="fromEmail">
      </div>
    </div>
  </div>

  <div class="col-right">
    <div class="col-title">TO (Receiving Company)</div>
    <div class="col-body">
      <div class="form-group">
        <label>Company Name</label>
        <input type="text" id="toCompanyName">
      </div>
      <div class="form-group">
        <label>Department</label>
        <input type="text" id="toDepartment">
      </div>
      <div class="form-group">
        <label>Contact Person</label>
        <input type="text" id="toContactPerson">
      </div>
      <div class="form-group">
        <label>Location / Suite</label>
        <input type="text" id="toLocation">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="toEmail">
      </div>
    </div>
  </div>

</div>

<div class="form-section">

  <div class="section-title">MATERIAL DETAILS</div>

  <div class="section-body">

    <table>

      <thead>
        <tr>
          <th>#</th>
          <th>Item / Part Number</th>
          <th>Description</th>
          <th>Unit of Measure</th>
          <th>Qty Transferred</th>
          <th></th>
        </tr>
      </thead>

      <tbody id="materialRows">

        <tr>
          <td>1</td>
          <td><input type="text"></td>
          <td><input type="text"></td>
          <td><input type="text"></td>
          <td><input type="number" class="qty" value="0"></td>

          <td>
            <button
              type="button"
              class="danger"
              onclick="removeRow(this)">
              Remove
            </button>
          </td>
        </tr>

      </tbody>

    </table>

    <div style="margin-top:8px;">
      <button
        type="button"
        class="secondary"
        onclick="addRow()">
        + Add Row
      </button>
    </div>

    <div class="summary">
      Total Items:
      <span id="totalItems">0</span>
    </div>

  </div>
</div>

<div class="form-section">

  <div class="section-title">PURPOSE / REASON FOR TRANSFER</div>

  <div class="section-body">

    <div class="form-group">
      <label>Reason</label>
      <textarea id="reason"></textarea>
    </div>

  </div>
</div>

<div class="form-section">

  <div class="section-title">AUTHORIZATION &amp; SIGNATURES</div>

  <div class="section-body">

    <div class="sig-row">
      <div class="form-group">
        <label>Released By (From Co.)</label>
        <input type="text" id="releasedBy">
      </div>
      <div class="form-group">
        <label>Signature</label>
        <input type="text" id="releasedSignature">
      </div>
      <div class="form-group">
        <label>Date</label>
        <input type="date" id="releasedDate">
      </div>
    </div>

    <div class="sig-row">
      <div class="form-group">
        <label>Received By (To Co.)</label>
        <input type="text" id="receivedBy">
      </div>
      <div class="form-group">
        <label>Signature</label>
        <input type="text" id="receivedSignature">
      </div>
      <div class="form-group">
        <label>Date</label>
        <input type="date" id="receivedDate">
      </div>
    </div>

  </div>
</div>

<div class="form-section">

  <div class="section-title">NOTES</div>

  <div class="section-body">

    <div class="form-group">
      <textarea id="notes"></textarea>
    </div>

  </div>
</div>

<div class="buttons">

  <button class="secondary" onclick="window.print()">
    Print
  </button>

  <button class="primary" onclick="exportPDF()">
    Download PDF
  </button>

  <button class="primary" onclick="exportExcel()">
    Download Excel
  </button>

</div>

</div>

<script>

document.getElementById('formDate').valueAsDate =
  new Date();

let mtfSettings = {};

// Form # lives in localStorage per device, same pattern as the NCR
// generator's counter - it's not something to share across machines.
function loadFormNumber(){
  const saved = localStorage.getItem('mtfSettings');
  mtfSettings = saved ? JSON.parse(saved) : { formCounter: 1 };
  if (!mtfSettings.formCounter) mtfSettings.formCounter = 1;
  updateFormNumberDisplay();
}

function updateFormNumberDisplay(){
  document.getElementById('formNumberDisplay').textContent =
    `MTF-${String(mtfSettings.formCounter).padStart(4, '0')}`;
}

function startEditFormNumber(){
  const el = document.getElementById('formNumberDisplay');
  el.innerHTML = `<input type="number" id="formNumberEditInput" value="${mtfSettings.formCounter}" min="0" step="1" style="font-size:16px;font-weight:700;color:#1e5a96;font-family:monospace;width:90px;border:1px solid #1e5a96;border-radius:4px;padding:2px 4px;">`;
  const input = document.getElementById('formNumberEditInput');
  input.focus();
  input.select();
  input.addEventListener('blur', commitFormNumberEdit);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') input.blur();
    if (e.key === 'Escape') { input.removeEventListener('blur', commitFormNumberEdit); updateFormNumberDisplay(); }
  });
}

function commitFormNumberEdit(){
  const input = document.getElementById('formNumberEditInput');
  const value = parseInt(input.value, 10);
  if (!isNaN(value) && value >= 0) {
    mtfSettings.formCounter = value;
    localStorage.setItem('mtfSettings', JSON.stringify(mtfSettings));
  }
  updateFormNumberDisplay();
}

// FROM (Transferring Company) fields come from the same shared repo files
// the NCR generator uses, so this side of the form is the same on every
// machine without retyping it - see data/company-defaults.json and the
// gitignored data/company-email.json.
async function loadFromCompanyDefaults(){
  let defaults = {};
  let emailDefaults = {};
  try {
    const res = await fetch('./data/company-defaults.json');
    if (res.ok) defaults = await res.json();
  } catch (e) {
    // offline, or opened as a local file instead of served over http.
  }
  try {
    const res = await fetch('./data/company-email.json');
    if (res.ok) emailDefaults = await res.json();
  } catch (e) {
    // not present (normal on the public site) or offline - blank is fine.
  }
  document.getElementById('fromCompanyName').value = defaults.companyName || '';
  document.getElementById('fromContactPerson').value = defaults.purchaserName || '';
  document.getElementById('fromEmail').value = emailDefaults.purchaserEmail || '';
}

loadFormNumber();
loadFromCompanyDefaults();

// Pre-populate 10 material rows to match the printed form.
for (let i = 0; i < 9; i++) addRow();

function addRow(){

  const tbody =
    document.getElementById('materialRows');

  const rowCount =
    tbody.rows.length + 1;

  const row =
    document.createElement('tr');

  row.innerHTML = `
    <td>${rowCount}</td>
    <td><input type="text"></td>
    <td><input type="text"></td>
    <td><input type="text"></td>
    <td>
      <input
        type="number"
        class="qty"
        value="0">
    </td>

    <td>
      <button
        type="button"
        class="danger"
        onclick="removeRow(this)">
        Remove
      </button>
    </td>
  `;

  tbody.appendChild(row);

  attachQtyListeners();

  updateTotals();
}

function removeRow(btn){

  btn.closest('tr').remove();

  renumberRows();

  updateTotals();
}

function renumberRows(){

  document
    .querySelectorAll('#materialRows tr')
    .forEach((row,index)=>{

      row.cells[0].innerText =
        index + 1;
    });
}

function attachQtyListeners(){

  document
    .querySelectorAll('.qty')
    .forEach(input=>{

      input.removeEventListener(
        'input',
        updateTotals
      );

      input.addEventListener(
        'input',
        updateTotals
      );
    });
}

function updateTotals(){

  let total = 0;

  document
    .querySelectorAll('.qty')
    .forEach(q=>{

      total +=
        parseFloat(q.value) || 0;
    });

  document.getElementById(
    'totalItems'
  ).innerText = total.toFixed(2);
}

attachQtyListeners();

updateTotals();

function exportPDF(){

  const element =
    document.getElementById('pdfContent');

  const opt = {

    margin:[4,4,4,4],

    filename:
      `MaterialTransferForm_${
        new Date()
        .toISOString()
        .split('T')[0]
      }.pdf`,

    image:{
      type:'jpeg',
      quality:0.98
    },

    html2canvas:{
      scale:2,
      useCORS:true,
      scrollX:0,
      scrollY:0
    },

    jsPDF:{
      unit:'mm',
      format:'a4',
      orientation:'portrait'
    },

    pagebreak:{
      mode:['avoid-all']
    }
  };

  html2pdf()
    .set(opt)
    .from(element)
    .save();
}

function exportExcel(){

  const wb =
    XLSX.utils.book_new();

  const data = [];

  data.push([
    "MATERIAL TRANSFER FORM"
  ]);

  data.push([]);

  document
    .querySelectorAll('#materialRows tr')
    .forEach((row,index)=>{

      const inputs =
        row.querySelectorAll('input');

      data.push([
        index + 1,
        inputs[0].value,
        inputs[1].value,
        inputs[2].value,
        inputs[3].value
      ]);
    });

  const ws =
    XLSX.utils.aoa_to_sheet(data);

  XLSX.utils.book_append_sheet(
    wb,
    ws,
    "MTF"
  );

  XLSX.writeFile(
    wb,
    `MaterialTransferForm_${
      new Date()
      .toISOString()
      .split('T')[0]
    }.xlsx`
  );
}

</script>

</body>
</html>
